PageName: Arcane Misfires
Backfires: Backfires
Enabled: Enable backfires
Chance: Backfire chance per failed cast (%)
CriticalChance: Critical Failure chance per miscast (%)
CriticalChanceDescription: Chance for a triggered miscast to become a Critical Failure. Ordinary backlash has 10 times its usual magnitude, with unchanged duration. With Wild Intervention enabled, teleport criticals instead unequip all gear and play the teleportation voice line after a successful arrival. Gear stays in your inventory.
Severity: Maximum severity (1-3)
Messages: Show backfire messages
NiftyWildIntervention: Wild Intervention On Teleport Miscasts
NiftyWildInterventionDescription: Miscasts of Recall, Divine Intervention, or Almsivi Intervention trigger Wild Intervention. Use Nifty Spell Pack's spell when available, otherwise the built-in equivalent. Turn off to use the normal backlash. Does not change the backfire chance.
WildInterventionFailed: Wild Intervention could not find a destination.
CriticalTeleportDropItems: Critical Teleport Failure - Drop All Items
CriticalTeleportDropItemsDescription: On a critical Wild Intervention, leave your entire inventory at the departure point before teleporting. Includes equipped gear, gold, keys and quest items. Items keep their stacks and are spread across checked nearby floor positions at one height. Large inventories may overlap horizontally. If no safe nearby floor is found, teleport normally and only unequip gear, keeping all items in inventory. Off by default; otherwise only equipped gear is unequipped.
Immersion: Immersion
OverencumberedTeleportCritical: Always Critical Teleport Miscasts When Overencumbered
OverencumberedTeleportCriticalDescription: When a miscast is triggered for a spell containing Recall, Divine Intervention, or Almsivi Intervention, make it critical if your current encumbrance exceeds your carrying capacity. Overrides the critical chance, even at 0%, but keeps the normal backfire chance. Uses normal critical teleport rules when Wild Intervention is enabled, or critical backlash when disabled. Off by default.
ImmersionDescription: Only play the critical teleportation voice line when your character is a male High Elf (Altmer). Off by default; otherwise it can play for any race or sex.
FailedCastExperience: Experience From Failed Casts
FailedCastExperienceDescription: Gain the same skill progress from a failed cast as from a successful cast.
ExperienceOnlyMisfires: Experience Only On Misfires
ExperienceOnlyMisfiresDescription: Award failed-cast experience only when a misfire occurs. Turn off to award experience for all failed casts. Requires Experience From Failed Casts.
UseMisfireSchool: Use Misfire Effect's School
UseMisfireSchoolDescription: When a misfire occurs, award experience in the misfire effect's school instead of the attempted spell's school. Failed casts without a misfire use the attempted spell's school. Requires Experience From Failed Casts.
